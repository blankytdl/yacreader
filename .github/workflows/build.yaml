name: Build

# Standalone build for forks: no signing secrets, no clang-format gate and no
# prebuilt binaries from the `dependencies` folder are required.
# Run it from the "Actions" tab ("Run workflow") or push to any branch.
# The project folder is found automatically: repository root, a subfolder, or
# even a .zip of the project committed to the repository.

on:
  workflow_dispatch:
    inputs:
      pdf_backend:
        description: "PDF backend (pdfium downloads prebuilt binaries from bblanchon/pdfium-binaries)"
        type: choice
        default: no_pdf
        options:
          - no_pdf
          - pdfium
  push:
    branches:
      - "**"
  pull_request:

env:
  QT_VERSION: "6.9.3"

jobs:
  windows-x64:
    name: Windows x64 (Qt6 + 7zip)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Locate YACReader source
        shell: pwsh
        run: |
          function Find-Source {
            Get-ChildItem -Path . -Filter CMakeLists.txt -Recurse -Depth 5 -File |
              Where-Object { Test-Path (Join-Path $_.DirectoryName "YACReaderLibrary/CMakeLists.txt") } |
              Sort-Object { $_.FullName.Length } |
              Select-Object -First 1
          }

          $cmake = Find-Source

          # The project may have been uploaded as a .zip instead of extracted files
          if (-not $cmake) {
            Get-ChildItem -Path . -Filter *.zip -Recurse -Depth 3 -File | ForEach-Object {
              Write-Host "Extracting $($_.FullName)"
              Expand-Archive -Path $_.FullName -DestinationPath "_extracted/$($_.BaseName)" -Force
            }
            $cmake = Find-Source
          }

          if (-not $cmake) {
            Get-ChildItem -Depth 2 | Format-Table FullName
            throw "Could not find the YACReader source (a folder with CMakeLists.txt and YACReaderLibrary/)"
          }

          $src = $cmake.DirectoryName
          Write-Host "Source directory: $src"
          "SRC_DIR=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qt5compat qtmultimedia qtimageformats qtshadertools qtspeech"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch pdfium (optional)
        if: ${{ github.event.inputs.pdf_backend == 'pdfium' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium_tmp | Out-Null
          tar -xzf pdfium.tgz -C pdfium_tmp
          # layout expected by cmake/Findpdfium.cmake
          $deps = "$env:SRC_DIR/dependencies/pdfium/win"
          New-Item -ItemType Directory -Force "$deps/public", "$deps/x64" | Out-Null
          Copy-Item -Recurse -Force pdfium_tmp/include/* "$deps/public/"
          Copy-Item -Force pdfium_tmp/lib/pdfium.dll.lib "$deps/x64/pdfium.lib"
          Copy-Item -Force pdfium_tmp/bin/pdfium.dll "$deps/x64/pdfium.dll"

      - name: Configure
        shell: pwsh
        run: |
          $pdf = "${{ github.event.inputs.pdf_backend }}"
          if ([string]::IsNullOrEmpty($pdf)) { $pdf = "no_pdf" }
          cmake -S "$env:SRC_DIR" -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DDECOMPRESSION_BACKEND=7zip" `
            "-DPDF_BACKEND=$pdf" `
            "-DBUILD_NUMBER=${{ github.run_number }}" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (portable)
        shell: pwsh
        run: |
          $src = $env:SRC_DIR
          $dist = "dist/YACReader"
          New-Item -ItemType Directory -Force $dist | Out-Null

          Copy-Item build/bin/YACReader.exe, build/bin/YACReaderLibrary.exe, build/bin/YACReaderLibraryServer.exe $dist
          Copy-Item "$src/COPYING.txt", "$src/README.md" $dist

          windeployqt --release -qml "$dist/YACReader.exe"
          windeployqt --release -qml --qmldir "$src/YACReaderLibrary/qml" "$dist/YACReaderLibrary.exe"
          windeployqt --release "$dist/YACReaderLibraryServer.exe"

          if (Test-Path "$src/dependencies/pdfium/win/x64/pdfium.dll") {
            Copy-Item "$src/dependencies/pdfium/win/x64/pdfium.dll" $dist
          }

          if (Test-Path "$src/release/server") {
            Copy-Item -Recurse "$src/release/server" "$dist/server"
          }

          # translations generated by cmake in the build tree
          New-Item -ItemType Directory -Force "$dist/languages" | Out-Null
          Get-ChildItem build -Recurse -Filter *.qm |
            Where-Object { $_.BaseName -notmatch "_source$" } |
            Copy-Item -Destination "$dist/languages"

      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: YACReader-windows-x64-${{ github.run_number }}
          path: dist/YACReader
          if-no-files-found: error
