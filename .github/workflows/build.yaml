name: Build

# Standalone build for forks: no signing secrets, no clang-format gate and no
# prebuilt binaries from the `dependencies` folder are required.
# Run it from the "Actions" tab ("Run workflow") or push to any branch.

on:
  workflow_dispatch:
    inputs:
      pdf_backend:
        description: "PDF backend (pdfium downloads prebuilt binaries from bblanchon/pdfium-binaries)"
        type: choice
        default: no_pdf
        options:
          - no_pdf
          - pdfium
  push:
    branches:
      - "**"
  pull_request:

env:
  QT_VERSION: "6.9.3"

jobs:
  windows-x64:
    name: Windows x64 (Qt6 + 7zip)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qt5compat qtmultimedia qtimageformats qtshadertools qtspeech"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch pdfium (optional)
        if: ${{ github.event.inputs.pdf_backend == 'pdfium' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium_tmp | Out-Null
          tar -xzf pdfium.tgz -C pdfium_tmp
          # layout expected by cmake/Findpdfium.cmake
          New-Item -ItemType Directory -Force dependencies/pdfium/win/public, dependencies/pdfium/win/x64 | Out-Null
          Copy-Item -Recurse -Force pdfium_tmp/include/* dependencies/pdfium/win/public/
          Copy-Item -Force pdfium_tmp/lib/pdfium.dll.lib dependencies/pdfium/win/x64/pdfium.lib
          Copy-Item -Force pdfium_tmp/bin/pdfium.dll dependencies/pdfium/win/x64/pdfium.dll

      - name: Configure
        shell: pwsh
        run: |
          $pdf = "${{ github.event.inputs.pdf_backend }}"
          if ([string]::IsNullOrEmpty($pdf)) { $pdf = "no_pdf" }
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDECOMPRESSION_BACKEND=7zip `
            -DPDF_BACKEND=$pdf `
            -DBUILD_NUMBER="${{ github.run_number }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package (portable)
        shell: pwsh
        run: |
          $dist = "dist/YACReader"
          New-Item -ItemType Directory -Force $dist | Out-Null

          Copy-Item build/bin/YACReader.exe, build/bin/YACReaderLibrary.exe, build/bin/YACReaderLibraryServer.exe $dist
          Copy-Item COPYING.txt, README.md $dist

          windeployqt --release -qml "$dist/YACReader.exe"
          windeployqt --release -qml --qmldir YACReaderLibrary/qml "$dist/YACReaderLibrary.exe"
          windeployqt --release "$dist/YACReaderLibraryServer.exe"

          if (Test-Path dependencies/pdfium/win/x64/pdfium.dll) {
            Copy-Item dependencies/pdfium/win/x64/pdfium.dll $dist
          }

          if (Test-Path release/server) {
            Copy-Item -Recurse release/server "$dist/server"
          }

          # translations generated by cmake in the build tree
          New-Item -ItemType Directory -Force "$dist/languages" | Out-Null
          Get-ChildItem build -Recurse -Filter *.qm |
            Where-Object { $_.BaseName -notmatch "_source$" } |
            Copy-Item -Destination "$dist/languages"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: YACReader-windows-x64-${{ github.run_number }}
          path: dist/YACReader
          if-no-files-found: error
